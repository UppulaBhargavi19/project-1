<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            color: brown;
            background-color: aqua;
            font-style: italic;
        }
        button:hover{
            color:black;
            background-color: burlywood;
            font-size: large;
            font-weight: 300;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        li:first-child{
            color:rgb(0, 255, 174);
            font-size: 20px;
            font-weight: 100;
            font-family: 'Times New Roman', Times, serif;
        }
        li:last-child{
            color:red;
            background-color: rgba(136, 255, 0, 0.852);
            text-align: center;
            text-transform: uppercase;
        }
        li:nth-child(3){
            font-style:oblique;
        }
        h1::before{
            content: "❤️";
        }
        h1::after{
            content:"🔥";
        }
        h2::before{
            content:"🔥";
        }

    </style>
</head>
<body>
    <button>AddToCart</button>
    <ul>
        <li>Grapes</li>
        <li>banana</li>
        <li>mango</li>
        <li>orange</li>
    </ul>
    <h1>I like Ratan sir classes</h1>
    <h1>Ratan sir teaching skills are too good</h1>
    <h2>Excited to learn new things..</h2>
</body>
</html>
