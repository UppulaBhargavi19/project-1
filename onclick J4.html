<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function votecheck(){
            let number= document.getElementById("number").value;
            if(number>0) {
                document.getElementById("msg").innerHTML="your number is positive";
            }
            else if(number<0) {
                document.getElementById("msg").innerHTML="your number is negative";
            }
            else if(number==0) {
                document.getElementById("msg").innerHTML="your number is zero";
            }
            else {
                document.getElementById("msg").innerHTML="not a number";
            }
        }
    </script>
</head>
<body>
    <h1>Number Check...</h1>
    <label for="number">Enter your number:</label>
    <input type="number" id="number" name="number">
    <button onclick="votecheck()">check</button>
    <p id="msg"></p>
</body>
</html>
