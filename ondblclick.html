<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function greet(){
            document.getElementById("display").innerHTML="Runs when you doubleclick an element";
        }
    </script>
</head>
<body>
    <button ondblclick="greet()">dblclick</button>
    <p id="display"></p>
</body>
</html>
